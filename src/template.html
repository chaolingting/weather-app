<body>



    
  <main>
        <header><h1 class="header-text">Hello world, let's search some weather! </h1></header>


    <div class="weather">
      <form id="weather-form">
        <input type="search" name="query" id="search-input" placeholder="Location">
        <button id="search-weather" type="submit" >👀</button>
      </form>

      <div class="loader hidden"></div>
      <div class="weather-output">

      </div>
      <div class="default-weather"></div>
    </div>

  </main>
